services:
  design-review:
    build: .
    # Loopback only. Reverse-proxy on the same host; do not publish 0.0.0.0:8787.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DATA_DIR: /app/data
      COOKIE_SECURE: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - design-review-data:/app/data
    restart: unless-stopped

volumes:
  design-review-data:
